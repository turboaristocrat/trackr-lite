<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="TRACKR Lite - Fast Railway Track Machine Field Logbook & WhatsApp Report Generator">
  <meta name="theme-color" content="#0F172A">

  <!-- Mobile & PWA meta tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRACKR Lite">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TRACKR Lite</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Self-healing: if an older, broken service worker or cached asset bundle is stuck, purge cache
    const TRACKR_BUILD = '20261020_v2';
    try {
      if (localStorage.getItem('trackr_build_ver') !== TRACKR_BUILD) {
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
        }
        localStorage.setItem('trackr_build_ver', TRACKR_BUILD);
      }
    } catch (_) {}
  </script>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #loading-splash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #F8FAFC;
      transition: opacity 0.35s ease;
      padding: 20px;
      box-sizing: border-box;
    }
    #pwa-install-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 16px;
      right: 16px;
      max-width: 420px;
      margin: 0 auto;
      background: #191C20;
      color: #F8FAFC;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.45);
      z-index: 99999;
      align-items: center;
      justify-content: space-between;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #pwa-install-btn {
      background: #FDB324;
      color: #191C20;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    #pwa-close-btn {
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 18px;
      margin-left: 8px;
      cursor: pointer;
      padding: 4px;
    }
    #splash-reload-btn {
      display: none;
      margin-top: 18px;
      background: #FDB324;
      color: #191C20;
      border: none;
      border-radius: 9999px;
      padding: 10px 22px;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(253, 179, 36, 0.35);
    }
  </style>
</head>
<body style="background-color: #0F172A; margin: 0; padding: 0;">
  <!-- Welcome / Loading Splash Screen for Mobile & PWA with Brand Logo -->
  <div id="loading-splash">
    <div style="
      width: 90px;
      height: 90px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(253, 179, 36, 0.25);
      margin-bottom: 20px;
      background: #191C20;
      border: 1px solid rgba(253, 179, 36, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    ">
      <img src="icons/Icon-192.png" style="width: 100%; height: 100%; object-fit: cover;" alt="TRACKR Logo" />
    </div>
    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
      <span style="font-size: 26px; font-weight: 900; letter-spacing: 1px; color: #F8FAFC;">TRACKR</span>
      <span style="font-size: 11px; font-weight: 900; background: #FDB324; color: #191C20; padding: 3px 8px; border-radius: 6px; letter-spacing: 0.5px;">LITE</span>
    </div>
    <div style="font-size: 12.5px; color: #94A3B8; margin-bottom: 28px; letter-spacing: 0.3px;">
      Indian Railways Field Logbook
    </div>
    <div id="splash-spinner" style="
      width: 28px;
      height: 28px;
      border: 3px solid rgba(253, 179, 36, 0.2);
      border-top-color: #FDB324;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    "></div>
    <div id="splash-status" style="font-size: 13px; color: #94A3B8; margin-top: 16px; text-align: center; max-width: 280px; min-height: 20px;"></div>
    <button id="splash-reload-btn" onclick="cleanReload()">
      Tap to Refresh & Clean Cache
    </button>
  </div>

  <!-- Native PWA Install Banner -->
  <div id="pwa-install-banner">
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="icons/Icon-192.png" style="width: 36px; height: 36px; border-radius: 8px;" alt="Logo" />
      <div>
        <div style="font-weight: 700; font-size: 13.5px;">Install TRACKR Lite</div>
        <div style="font-size: 11.5px; color: #94A3B8;">Tap to install as field app</div>
      </div>
    </div>
    <div style="display: flex; align-items: center;">
      <button id="pwa-install-btn" onclick="window.triggerPwaInstall()">Install</button>
      <button id="pwa-close-btn" onclick="document.getElementById('pwa-install-banner').style.display='none'">✕</button>
    </div>
  </div>

  <script>
    // Clean reload utility: unregisters service workers, clears caches, and reloads
    function cleanReload() {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (let r of regs) { r.unregister(); }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (let k of keys) { caches.delete(k); }
          });
        }
      } catch (_) {}
      setTimeout(function() {
        window.location.href = window.location.pathname + '?v=' + Date.now();
      }, 300);
    }

    // PWA Install Prompt Capture
    window.deferredPwaPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPwaPrompt = e;
      const banner = document.getElementById('pwa-install-banner');
      if (banner && !window.matchMedia('(display-mode: standalone)').matches) {
        banner.style.display = 'flex';
      }
    });

    window.triggerPwaInstall = async function() {
      if (window.deferredPwaPrompt) {
        window.deferredPwaPrompt.prompt();
        const { outcome } = await window.deferredPwaPrompt.userChoice;
        if (outcome === 'accepted') {
          const banner = document.getElementById('pwa-install-banner');
          if (banner) banner.style.display = 'none';
        }
        window.deferredPwaPrompt = null;
        return outcome === 'accepted';
      } else {
        const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIos) {
          alert("To install TRACKR Lite on your iPhone/iPad:\n1. Tap the Share icon (square with arrow) at the bottom.\n2. Tap 'Add to Home Screen'.");
        } else {
          alert("To install TRACKR Lite, tap your browser's menu (three dots) and select 'Install app' or 'Add to Home Screen'.");
        }
      }
      return false;
    };

    window.addEventListener('appinstalled', () => {
      window.deferredPwaPrompt = null;
      const banner = document.getElementById('pwa-install-banner');
      if (banner) banner.style.display = 'none';
    });

    // Remove welcome splash screen when Flutter renders its first frame
    function hideSplash() {
      const splash = document.getElementById('loading-splash');
      if (splash && splash.style.opacity !== '0') {
        splash.style.opacity = '0';
        setTimeout(() => { if (splash.parentNode) splash.remove(); }, 350);
      }
    }
    window.addEventListener('flutter-first-frame', hideSplash);

    // Progressive status updates & safety timeout
    setTimeout(() => {
      const splash = document.getElementById('loading-splash');
      const status = document.getElementById('splash-status');
      if (splash && status) {
        status.innerText = 'Loading field logbook...';
      }
    }, 4000);

    setTimeout(() => {
      const splash = document.getElementById('loading-splash');
      const status = document.getElementById('splash-status');
      const btn = document.getElementById('splash-reload-btn');
      if (splash && splash.style.opacity !== '0') {
        if (status) status.innerText = 'Taking longer than usual...';
        if (btn) btn.style.display = 'block';
      }
    }, 8000);

    // Global error handler: if a script fails to load, prompt the user with a clean reload button
    window.addEventListener('error', function (e) {
      const status = document.getElementById('splash-status');
      const btn = document.getElementById('splash-reload-btn');
      if (status) status.innerText = 'Unable to load application assets.';
      if (btn) btn.style.display = 'block';
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
